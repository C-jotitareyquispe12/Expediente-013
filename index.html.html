<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expediente 013: La última guardia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060a;--paper:#e9e0c9;--ink:#2a2118;--red:#b3283a;--line:#3a3340}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#d8d2dc;font-family:"Courier New",monospace}
#app{max-width:960px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;padding:6px}
#top{display:flex;justify-content:space-between;align-items:center;min-height:32px}
#hint{color:#e8c860;font-size:14px}#pause{background:none;border:1px solid var(--line);color:#d8d2dc;padding:6px 10px;font:inherit}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{width:100%;max-height:100%;aspect-ratio:16/9;background:#000;border:2px solid var(--line);touch-action:none;cursor:pointer}
#toast{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:20px}
#inv{display:flex;gap:4px;overflow-x:auto;padding:6px 2px;justify-content:center}
.sl{flex:0 0 44px;height:44px;background:#efe6cf;border:3px solid #1d1519;border-radius:6px;font-size:24px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}.sl.e{opacity:.55;cursor:default}
#ctl{display:flex;justify-content:space-between;align-items:center}
#dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:3px}
#dpad button,#use{background:#1b1720;color:#e9e0c9;border:1px solid var(--line);font:inherit;touch-action:none}
#dpad [data-k=u]{grid-column:2}#use{padding:10px 20px;height:44px}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:12px;z-index:5;overflow:auto}
#modal[hidden]{display:none}
.box{background:#16121b;border:2px solid #6a5a78;max-width:560px;width:100%;padding:18px;max-height:92vh;overflow:auto;line-height:1.45}
.box h1{margin:0 0 6px;letter-spacing:3px;color:#e8dff0;font-size:30px}.box h1 span{color:var(--red);font-size:20px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btns button,.box input{flex:1 1 auto;padding:11px 14px;background:#2a2234;color:#f0e8f4;border:1px solid #6a5a78;font:inherit;font-size:15px;cursor:pointer;text-align:left}
.btns button:hover,.btns button:focus-visible,.on{background:var(--red)!important;outline:none}
.ask .btns button{flex-basis:100%}.menu .btns button{flex-basis:100%}
.paper{background:var(--paper);color:var(--ink);padding:14px;border:1px solid #8a7a5a}.paper h3{margin-top:0}
.stamp{color:var(--red);border:2px solid var(--red);display:inline-block;padding:2px 8px;transform:rotate(-4deg);font-weight:bold}
.ghost{color:#bfe8ff;font-style:italic}.eerie{color:var(--red);font-size:20px}.hand{font-style:italic}
.slots{display:flex;gap:8px}.slot{flex:1;min-height:44px;border:1px dashed #8a7a98;display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center;padding:2px}
.fig{width:48px;height:48px;object-fit:contain;background:#fbf6f3}.dl{display:flex;gap:12px;align-items:flex-end}.por{width:96px;flex:0 0 96px;margin:-30px 0 -18px -6px}#modal.low{background:linear-gradient(transparent 35%,#000a);align-items:flex-end}.box.low{border-radius:10px;background:#1b161ee8}.box.docm{background:transparent;border:0;text-align:center;max-width:520px}.box.docm .btns{justify-content:center}.box.docm .btns button{flex:0 0 auto}
.sheet{position:relative;text-align:left;background:#efe6cf linear-gradient(transparent 27px,#c9bd9a 28px) 0 0/100% 28px;color:#2a2118;padding:26px 22px 18px;box-shadow:0 10px 28px #000b;transform:rotate(-1deg);line-height:28px}
.sheet h3{margin:0 0 8px;line-height:1.2;border-bottom:2px solid #2a2118;padding-bottom:4px}.sheet p{margin:0 0 6px}
.sheet.typed{font-family:"Special Elite","Courier New",monospace;font-size:14px}.sheet.hand{font-family:"Caveat","Segoe Script","Comic Sans MS",cursive;font-size:22px}
.tape{position:absolute;top:-10px;left:42%;width:84px;height:20px;background:#e8d890aa;transform:rotate(3deg)}
.pol{display:inline-block;background:#f6f2e8;padding:10px 10px 12px;box-shadow:0 10px 28px #000b;transform:rotate(1.5deg);max-width:100%}.pol img{display:block;width:100%;max-width:400px}
.cap{font-family:"Caveat","Segoe Script",cursive;color:#2a2118;font-size:24px;margin:6px 0 0;text-align:center}
.pink{background:#f4b6c8;display:flex;align-items:center;justify-content:center;width:320px;max-width:100%;height:220px;border:2px dashed #fff8}.pink .fig{width:130px;height:130px}
.idphoto{float:right;width:92px;margin:0 0 6px 10px;text-align:center;font:12px/1.2 "Courier New",monospace}.idphoto img{width:100%;background:#cfe0ea;border:2px solid #222;display:block}button:disabled{opacity:.4;cursor:wait}
.who{color:#e8c860;font-weight:bold;margin-bottom:4px}.big{display:grid;grid-template-columns:repeat(4,1fr)}.big button{padding:4px;text-align:center}.big .fig{width:100%;height:auto;max-height:62px}.ch button{flex:1 1 40%}.q{color:#e8c860}.rev p{border-bottom:1px solid #333;padding-bottom:8px}
@media(pointer:coarse){#ctl{display:flex}}@media(pointer:fine){#dpad{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>

/* ---------- audio ---------- */
let ac = null;
function sfx(f, d = 0.12, type = "square", v = 0.05) {
  if (muted) return;
  try {
    ac = ac || new AudioContext();
    const o = ac.createOscillator(), a = ac.createGain();
    o.type = type; o.frequency.value = f; a.gain.value = v;
    o.connect(a); a.connect(ac.destination); o.start();
    a.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d); o.stop(ac.currentTime + d);
  } catch (e) {}
}
let drone = false;
function startDrone() {
  if (drone || muted) return; drone = true;
  try { ac = ac || new AudioContext(); const o = ac.createOscillator(), a = ac.createGain(); o.type = "sine"; o.frequency.value = 55; a.gain.value = 0.015; o.connect(a); a.connect(ac.destination); o.start(); } catch (e) {}
}

let sus = null;
function suspense(on) {
  if (!on) { if (sus) { clearInterval(sus.t); sus.nodes.forEach((n) => { try { n.stop(); } catch (e) {} }); sus = null; } return; }
  if (sus || muted) return;
  try {
    ac = ac || new AudioContext(); const nodes = [];
    const mk = (f, v, type) => { const o = ac.createOscillator(), a = ac.createGain(); o.type = type; o.frequency.value = f; a.gain.value = v; o.connect(a); a.connect(ac.destination); o.start(); nodes.push(o); return a; };
    const a1 = mk(110, 0.03, "sawtooth"); mk(116.5, 0.025, "sawtooth"); mk(220.5, 0.012, "triangle");
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 0.12; lg.gain.value = 0.02; lfo.connect(lg); lg.connect(a1.gain); lfo.start(); nodes.push(lfo);
    const t = setInterval(() => { sfx(55, 0.18, "sine", 0.14); setTimeout(() => sfx(50, 0.22, "sine", 0.1), 230); }, 1500);
    sus = { t, nodes };
  } catch (e) {}
}

function modal(html, btns = ["Continuar"], cls = "") {

// Selector de símbolos o dígitos. Devuelve array de ids o null si se cierra.
function pick(title, choices, n) {
  if (choices.length > 10) choices = [...choices].sort(() => Math.random() - 0.5);
  return new Promise((r) => {
    let sel = [];
    const m = $("#modal"); m.hidden = false; m.className = "";
    const lab = (id) => choices.find((c) => c.id === id).t;
    const draw = () => {
      m.innerHTML = `<div class="box"><p>${title}</p><div class="slots">${Array.from({ length: n }, (_, i) => `<span class="slot">${sel[i] !== undefined ? lab(sel[i]) : "_"}</span>`).join("")}</div>
      <div class="btns ch ${choices.length > 10 ? "big" : ""}">${choices.map((c) => `<button data-c="${c.id}">${c.t}</button>`).join("")}</div>
      <div class="btns"><button data-a="clr">Borrar</button><button data-a="ok">Probar</button><button data-a="x">Cerrar</button></div></div>`;
    };
    draw();
    m.onclick = (e) => {
      const b = e.target.closest("button"); if (!b) return; sfx(500, 0.04);
      if (b.dataset.c !== undefined) { if (sel.length < n) sel.push(b.dataset.c); draw(); }
      else if (b.dataset.a === "clr") { sel = []; draw(); }
      else if (b.dataset.a === "x") { m.hidden = true; m.innerHTML = ""; r(null); }
      else if (b.dataset.a === "ok" && sel.length === n) { m.hidden = true; m.innerHTML = ""; r(sel); }
    };
  });
}
